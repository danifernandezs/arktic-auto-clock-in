name: Daily clock-in

on:
  # Uncomment to enable automatic daily clock-in (weekdays, 07:00 UTC = 09:00 CEST).
  # See README for details.
  # schedule:
  #   - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to clock in (YYYY-MM-DD). Empty = today.'
        required: false
        default: ''

jobs:
  clock-in:
    runs-on: ubuntu-latest
    if: vars.CLOCK_IN_ENABLED != 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Clock-in
        env:
          ARKTIC_USER: ${{ secrets.ARKTIC_USER }}
          ARKTIC_PASS: ${{ secrets.ARKTIC_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: ./clock-in.sh "${{ github.event.inputs.date }}"
