name: Mark day as not worked

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to mark as not worked (YYYY-MM-DD). Empty = today.'
        required: false
        default: ''

jobs:
  unclock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark as not worked
        env:
          ARKTIC_USER: ${{ secrets.ARKTIC_USER }}
          ARKTIC_PASS: ${{ secrets.ARKTIC_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          DATE: ${{ github.event.inputs.date }}
        run: ./clock-in.sh --undo "$DATE"
